<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اعتذار لنورا</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
    <span class="sparkle sparkle-two" aria-hidden="true">✧</span>

    <p class="eyebrow">إلى حبيبتي نورا</p>
    <h1>عملتلك حاجة كده <span>اعتذار</span></h1>
    <p class="intro">ياااااااارب يا لوززززه تتصااااالحي</p>

    <button class="gift-button" id="giftButton" type="button" aria-expanded="false" aria-controls="gift">
      <span class="gift-icon" aria-hidden="true">🎁</span>
      <span id="buttonText">افتحي هديتك يا نورا</span>
    </button>

    <section class="gift" id="gift" hidden>
      <div class="flower" aria-label="وردة">
        <span class="petal-top" aria-hidden="true">🌹</span>
      </div>
      <div class="letter">
        <p class="letter-title">رسالة اعتذار</p>
        <p>حقك عليا يا نور عيني انا اسف عشان دايقتك بس حبيت اصالحك بالطريقه دي</p>
        <p class="signature">زوجك العزيز <span>حمووووزي</span></p>
        <p class="signature">بحبك</p>
      </div>
    </section>

    <p class="footer-note">هدية صغيرة من قلبي ليكي</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
